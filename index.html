<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gh0sty</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030304;--tx:#f0f0f2;--mut:#8d8d96;--ac:#e0282e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bl{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none}
.b1{width:480px;height:480px;background:#7a0f14;top:-120px;left:-120px;animation:d1 18s ease-in-out infinite alternate}
.b2{width:420px;height:420px;background:#2a2a3a;bottom:-100px;right:-100px;animation:d1 22s ease-in-out infinite alternate-reverse}
.b3{width:300px;height:300px;background:#3b0a0d;top:45%;left:55%;animation:d1 26s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,80px) scale(1.25)}}
.vg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,#000 100%)}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:30px 18px 70px}
.hero{position:relative;text-align:center;padding-top:10px}
.pic{width:min(380px,82vw);aspect-ratio:1;margin:0 auto;position:relative;animation:fl 6s ease-in-out infinite}
.pic img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(circle,#000 38%,transparent 71%);mask-image:radial-gradient(circle,#000 38%,transparent 71%)}
.pic:after{content:"";position:absolute;inset:12%;border-radius:50%;box-shadow:0 0 120px 20px rgba(224,40,46,.18);z-index:-1}
@keyframes fl{50%{transform:translateY(-12px) rotate(-1deg)}}
h1{font-family:Unbounded,'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(2.6rem,12vw,5rem);margin:-70px 0 6px;letter-spacing:-.02em;position:relative;line-height:1;text-shadow:0 0 40px rgba(0,0,0,.9)}
h1 em{font-style:normal;color:var(--ac)}
h1 em.z{display:inline-block;position:relative;transform:scaleX(.82);margin:0 -.03em}
h1 em.z:after{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:.1em;margin-left:-.05em;background:var(--ac);transform:rotate(24deg);border-radius:3px}
h1:before,h1:after{content:attr(data-t);position:absolute;left:0;right:0;opacity:.0}
.gl:before,.gl:after{opacity:.8}
.gl:before{color:#0ff;transform:translate(-3px,1px);clip-path:inset(0 0 55% 0)}
.gl:after{color:var(--ac);transform:translate(3px,-1px);clip-path:inset(50% 0 0 0)}
.tag{color:var(--mut);margin:12px 0 0;min-height:1.5em;font-size:1.05rem}
.tag:after{content:"▍";color:var(--ac);animation:bk 1s steps(1) infinite}
@keyframes bk{50%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:38px 0 0}
.t{--c:#fff;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:76px;border-radius:18px;background:linear-gradient(150deg,#19191c,#0d0d0f);border:1px solid rgba(255,255,255,.09);color:var(--tx);text-decoration:none;cursor:pointer;font:inherit;text-align:left;transition:transform .25s,border-color .25s,box-shadow .25s}
.t:before{content:"";position:absolute;width:130px;height:130px;right:-40px;top:-60px;border-radius:50%;background:var(--c);filter:blur(55px);opacity:.2;transition:.3s}
.t.on:hover{transform:translateY(-5px) scale(1.02);border-color:var(--c);box-shadow:0 14px 36px -12px var(--c)}
.t:hover:before{opacity:.5}
.t.f{grid-column:span 2}
.t i{flex:none;font-style:normal;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--c);background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);position:relative}
.t .x{position:relative;min-width:0;flex:1}
.t b{display:block;font-size:1.1rem}
.t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t i svg{width:24px;height:24px;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent));transition:transform .3s}
.t:hover i svg{transform:scale(1.15) rotate(-6deg)}
.pill{position:relative;flex:none;padding:8px 14px;border-radius:99px;font-size:.85rem;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);transition:.25s}
.t:hover .pill{background:var(--c);color:#000}
.arr{position:relative;color:var(--mut);transition:.25s}.t:hover .arr{color:var(--c);transform:translate(3px,-3px)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.t.f{grid-column:auto}}
#gc{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#gh{position:absolute;left:0;top:0;opacity:0;will-change:transform}
#gh img{width:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
h2{font-family:Unbounded,sans-serif;font-size:1.3rem;margin:60px 0 14px;display:flex;align-items:center;gap:12px}
h2:before,h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.2),transparent)}
h2:before{background:linear-gradient(270deg,rgba(255,255,255,.2),transparent)}
.box{display:grid;gap:8px;padding:14px;border-radius:20px;background:#101012;border:1px solid rgba(255,255,255,.09)}
input,textarea{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);color:var(--tx);border-radius:12px;padding:11px 13px;font:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(224,40,46,.2)}
textarea{resize:vertical;min-height:72px}
.s{background:linear-gradient(135deg,#e0282e,#9c1117);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.s:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px #e0282e}
.c{display:flex;gap:12px;margin-top:14px;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.bu{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.bu b{color:#fff}.bu time{color:var(--mut);font-size:.75rem;margin-left:8px}
.bu p{margin:4px 0 0;word-break:break-word;white-space:pre-wrap}
.note{color:var(--mut);font-size:.8rem;margin-top:10px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}.rv.on{opacity:1;transform:none}
footer{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 18px;color:#6a6a72;font-size:.82rem;margin-top:50px}
footer a{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;transition:.2s}
footer a:hover{color:#fff}footer svg{width:14px;height:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
#en{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;text-align:center;background:rgba(3,3,4,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;transition:opacity .7s,visibility .7s}
#en.off{opacity:0;visibility:hidden}
#en img{width:120px;animation:fl 4s ease-in-out infinite}
#en h1{margin:8px 0 18px;font-size:clamp(2.4rem,10vw,4rem)}
#en p{margin:0;color:var(--mut);letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;animation:bk2 2s ease-in-out infinite}
@keyframes bk2{50%{opacity:.3}}
#snd{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:none;align-items:center;gap:8px;padding:9px 13px;border-radius:99px;background:rgba(16,16,18,.88);border:1px solid rgba(255,255,255,.1)}
#snd.on{display:flex}
#snd button{background:none;border:0;color:var(--tx);cursor:pointer;display:grid;place-items:center;padding:0}
#snd svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#snd .w{fill:none}#snd .sl{fill:none;display:none}
#snd.m .w{display:none}#snd.m .sl{display:block}
#snd input{width:84px;padding:0;border:0;background:none;accent-color:#e0282e}
.wd{border-radius:22px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,#151518,#0b0b0d);overflow:hidden}
.stage{position:relative;height:clamp(330px,64vw,430px);display:grid;place-items:center;background:radial-gradient(ellipse 55% 45% at 50% 66%,rgba(224,40,46,.26),transparent 70%)}
.stage canvas{position:relative;z-index:1;cursor:grab;touch-action:pan-y}
.ped{position:absolute;bottom:38px;left:50%;width:190px;height:28px;margin-left:-95px;border-radius:50%;border:1px solid rgba(224,40,46,.55);background:radial-gradient(ellipse,rgba(224,40,46,.45),rgba(224,40,46,0) 72%);box-shadow:0 0 40px rgba(224,40,46,.35)}
.sname{position:absolute;z-index:2;top:16px;left:18px;font-family:Unbounded,sans-serif;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.hint{position:absolute;z-index:2;top:18px;right:18px;font-size:.72rem;color:var(--mut)}
.pick{display:flex;gap:8px;padding:12px;justify-content:center;border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.28)}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 0;max-width:100px;min-width:0;padding:9px 2px;border-radius:14px;border:1px solid rgba(255,255,255,.09);background:#0f0f11;color:var(--mut);font:inherit;font-size:.75rem;cursor:pointer;transition:.2s}
.pk canvas,.pk .lkb{width:46px;height:46px;image-rendering:pixelated;border-radius:9px}
.pk .lkb{display:grid;place-items:center;background:rgba(255,255,255,.05)}.pk .lkb svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;stroke-width:2}
.pk:hover{transform:translateY(-3px);color:var(--tx)}
.pk.on{border-color:var(--ac);color:#fff;box-shadow:0 8px 24px -10px var(--ac)}
.pk.lk{opacity:.55;cursor:not-allowed}.pk.lk:hover{transform:none}
@media(max-width:400px){.pk canvas,.pk .lkb{width:38px;height:38px}.hint{display:none}main{padding-left:14px;padding-right:14px}}
.grid{grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(116px,auto)}
.t{grid-column:span 2;flex-direction:column;align-items:stretch;justify-content:space-between;gap:16px;padding:16px;min-height:116px}
.t.f{grid-column:span 4;flex-direction:row;align-items:center;justify-content:flex-start}
.t.tall{grid-row:span 2}
.t .top{position:relative;display:flex;justify-content:space-between;align-items:flex-start}
.t .x{flex:none}.t.f .x{flex:1}
.t .arr{font-size:1.1rem}
.tall i{width:58px;height:58px}.tall i svg{width:30px;height:30px}
.tall .pill{align-self:flex-start}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.t{grid-column:span 1}.t.f{grid-column:span 2}.t.tall{grid-row:span 1}.tall .pill{display:none}.tall i{width:46px;height:46px}.tall i svg{width:24px;height:24px}}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:40px auto 0;max-width:640px}
.ic{--c:#fff;position:relative;width:70px;height:70px;border-radius:22px;display:grid;place-items:center;color:var(--c);background:linear-gradient(150deg,#1a1a1d,#0c0c0e);border:1px solid rgba(255,255,255,.09);cursor:pointer;padding:0;font:inherit;text-decoration:none;transition:transform .25s,border-color .25s,box-shadow .25s}
.ic:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 130%,var(--c),transparent 65%);opacity:.18;transition:.3s}
.ic svg{position:relative;width:30px;height:30px;fill:currentColor;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 60%,transparent));transition:transform .3s}
.ic.on:hover{transform:translateY(-8px) scale(1.08);border-color:var(--c);box-shadow:0 16px 34px -12px var(--c)}
.ic:hover:before{opacity:.45}.ic:hover svg{transform:scale(1.12) rotate(-5deg)}
.ic:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translate(-50%,4px);white-space:nowrap;padding:5px 10px;border-radius:8px;background:#000;border:1px solid rgba(255,255,255,.12);font-size:.72rem;color:var(--tx);opacity:0;pointer-events:none;transition:.2s;z-index:3}
.ic:hover:after,.ic:focus-visible:after,.ic.cp:after{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.icons{gap:12px;max-width:340px}.ic{width:62px;height:62px;border-radius:19px}.ic svg{width:27px;height:27px}}
